name: Test Gradmire

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gradmire
          POSTGRES_PASSWORD: gradmire
          POSTGRES_DB: gradmire
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gradmire"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://gradmire:gradmire@127.0.0.1:5432/gradmire
      ADMIN_API_TOKEN: ci-admin-token
      # The booking tests create (and drop) their own databases on this server.
      TEST_DATABASE_URL: postgres://gradmire:gradmire@127.0.0.1:5432/postgres

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install backend dependencies
        run: npm ci --prefix backend

      - name: Validate backend JavaScript
        run: npm run check --prefix backend

      - name: Run database migrations
        run: |
          npm run migrate --prefix backend
          # A second run must be a no-op.
          npm run migrate --prefix backend

      - name: Run backend tests (booking, auth, security, integration, roles)
        run: npm test --prefix backend

      - name: Validate shared frontend JavaScript
        run: |
          for file in site api booking-common booking manage-consultation my-consultations admin-consultations admin-students student-dashboard workspace student-area staff-area google-signin reset-password; do
            node --check "frontend/assets/$file.js"
          done

      - name: Validate frontend links and assets
        run: node scripts/check-frontend-links.mjs

      - name: Validate Vercel configuration
        run: node -e "JSON.parse(require('fs').readFileSync('frontend/vercel.json', 'utf8'))"

      - name: Start backend
        run: |
          node backend/src/server.js > /tmp/gradmire-api.log 2>&1 &
          echo $! > /tmp/gradmire-api.pid
          curl --fail --silent --show-error --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:4000/api/v1/health

      - name: Start frontend
        run: |
          python3 -m http.server 8080 --directory frontend > /tmp/gradmire-frontend.log 2>&1 &
          echo $! > /tmp/gradmire-frontend.pid
          curl --fail --silent --show-error --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:8080/pages/index.html
          curl --fail --silent --show-error http://127.0.0.1:8080/assets/site.js

      - name: Test lead API
        run: |
          response=$(curl --fail --silent --show-error \
            -X POST http://127.0.0.1:4000/api/v1/leads \
            -H 'Content-Type: application/json' \
            -d '{"source":"consultation","firstName":"CI","email":"ci@example.com","phone":"+910000000000","contactConsent":true}')
          echo "$response" | grep -q 'ci@example.com'

          curl --fail --silent --show-error             -X POST http://127.0.0.1:4000/api/v1/leads             -H 'Content-Type: application/json'             -d '{"source":"contact","firstName":"CI","email":"ci@example.com","message":"CI contact enquiry"}' > /dev/null

          status=$(curl --silent --output /dev/null --write-out '%{http_code}'             -X POST http://127.0.0.1:4000/api/v1/leads             -H 'Content-Type: application/json'             -d '{"source":"consultation","firstName":"CI","email":"ci@example.com"}')
          test "$status" = 400

          status=$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:4000/api/v1/leads)
          test "$status" = 401

          count=$(curl --fail --silent --show-error http://127.0.0.1:4000/api/v1/leads             -H "Authorization: Bearer $ADMIN_API_TOKEN" | grep -o '"email":"ci@example.com"' | wc -l)
          test "$count" -eq 2

      - name: Stop backend
        if: always()
        run: |
          if [ -f /tmp/gradmire-api.pid ]; then
            kill "$(cat /tmp/gradmire-api.pid)" || true
          fi
          if [ -f /tmp/gradmire-frontend.pid ]; then
            kill "$(cat /tmp/gradmire-frontend.pid)" || true
          fi
