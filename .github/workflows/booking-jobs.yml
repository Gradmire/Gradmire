name: Booking background jobs

# Runs calendar sync retries, notification delivery and reminders by calling the
# API's job endpoint. Vercel Hobby cron can only run once a day, so this is the
# free scheduler. GitHub may delay scheduled runs by several minutes; for exact
# reminder timing use Vercel Cron (Pro) or a long-running `npm run worker`.
# Does nothing until the BOOKING_JOBS_URL and CRON_SECRET repository secrets exist.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: booking-jobs
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call the job endpoint
        env:
          BOOKING_JOBS_URL: ${{ secrets.BOOKING_JOBS_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$BOOKING_JOBS_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "BOOKING_JOBS_URL or CRON_SECRET is not configured; skipping."
            exit 0
          fi
          curl --fail --silent --show-error --max-time 60 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$BOOKING_JOBS_URL"
