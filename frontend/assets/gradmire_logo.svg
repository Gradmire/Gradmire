<svg xmlns="http://www.w3.org/2000/svg" width="1408" height="768" viewBox="0 0 1408 768">
  <defs>
    <linearGradient id="blueTeal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#102b53"/>
      <stop offset="1" stop-color="#0e7d80"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#000" flood-opacity=".18"/>
    </filter>
  </defs>

  <rect width="1408" height="768" fill="#f7f7f5"/>

  <!-- Logo mark -->
  <g transform="translate(704 315)" fill="none" filter="url(#shadow)">
    <!-- outer broken circular path -->
    <path d="M-138 78 A150 150 0 0 1 -18 -138 A150 150 0 0 1 129 -1"
          stroke="#132f57" stroke-width="15"/>
    <path d="M132 2 A150 150 0 0 1 -68 143"
          stroke="#132f57" stroke-width="15"/>

    <!-- inner teal progress ring -->
    <path d="M-85 55 A104 104 0 0 1 -14 -92 A104 104 0 0 1 119 -23"
          stroke="#1c7479" stroke-width="14"/>
    <path d="M110 36 A104 104 0 0 1 -48 106"
          stroke="#1c7479" stroke-width="14"/>

    <!-- graduation cap -->
    <path d="M25 -184 L113 -164 L169 -95 L81 -110 L28 -160 Z"
          fill="#132f57" stroke="#132f57" stroke-width="2"/>
    <path d="M26 -182 L-8 -118" stroke="#132f57" stroke-width="11"/>
    <circle cx="-8" cy="-118" r="6" fill="#132f57"/>
    <path d="M19 -171 L79 -115 L133 -101" stroke="#f7f7f5" stroke-width="7"/>

    <!-- compass arrow -->
    <path d="M-169 99 L-40 38 L-84 176 L-101 112 Z"
          fill="#132f57"/>
    <path d="M-148 100 L-72 64 L-102 143 Z"
          fill="#f7f7f5"/>

    <!-- G crossbar -->
    <path d="M-1 10 H145 V44 H58 V61 H125"
          stroke="url(#blueTeal)" stroke-width="17" stroke-linejoin="miter"/>
  </g>

  <!-- Wordmark -->
  <g text-anchor="middle">
    <text x="704" y="595"
          font-family="Montserrat, Arial, Helvetica, sans-serif"
          font-size="108" font-weight="800" letter-spacing="2"
          fill="url(#blueTeal)">GRADMIRE</text>
    <text x="704" y="635"
          font-family="Montserrat, Arial, Helvetica, sans-serif"
          font-size="34" font-weight="400" letter-spacing="1.5"
          fill="#454a50">YOUR PATH TO THE RIGHT COURSE</text>
  </g>
</svg>